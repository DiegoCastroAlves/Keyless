name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            apps/extension/pnpm-lock.yaml
            apps/site/pnpm-lock.yaml

      - name: Frontend type check and build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Browser extension type check and build
        working-directory: apps/extension
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Browser extension field detection tests
        working-directory: apps/extension
        env:
          CHROMIUM: google-chrome
        run: |
          pnpm test
          pnpm test:firefox

      - name: Site type check and build
        working-directory: apps/site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Frontend build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Clippy (Windows)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (Windows)
        run: cargo test --workspace

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      CARGO_HOME: /tmp/cargo-home
      CARGO_TARGET_DIR: /tmp/cargo-target
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust nodejs pnpm webkit2gtk-4.1 gtk3 libsoup3 hicolor-icon-theme polkit

      - uses: actions/checkout@v4

      # Saved on main and reused by the release workflow.
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/cargo-home/registry
            /tmp/cargo-home/git
            /tmp/cargo-target
          key: arch-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-cargo-

      - name: Build the Arch Linux package
        run: .github/scripts/build-arch-package.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The Rust client for each architecture, with the runner's NDK.
      - name: Native library
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 -o apps/android/app/src/main/jniLibs build -p keyless-android --release

      - name: Build the APK
        working-directory: apps/android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      # Compile errors as one annotation (job logs need a login to read).
      - name: Report build errors
        if: failure()
        working-directory: apps/android
        run: |
          test -f build.log || exit 0
          message=$(grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -80 | sed -e 's/%/%25/g' -e 's#file:///home/runner/work/Keyless/Keyless/##' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build::${message}"

      - uses: actions/upload-artifact@v4
        with:
          name: keyless-android
          path: apps/android/app/build/outputs/apk/release/*.apk

  # The APK on an emulator: what works without an account (smoke.py).
  android-emulator:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: keyless-android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 apps/android/scripts/smoke.py apk/app-release.apk

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # An unsigned app and disk image (no Apple developer account yet).
      - name: Build the app
        working-directory: apps/desktop
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm exec tauri build --bundles app,dmg 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: apps/desktop
        run: |
          test -f build.log || exit 0
          message=$(grep -E "^(error|warning: unused)" -A7 build.log | head -120 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=macOS build::${message}"

      - uses: actions/upload-artifact@v4
        with:
          name: keyless-macos
          path: target/release/bundle/dmg/*.dmg
