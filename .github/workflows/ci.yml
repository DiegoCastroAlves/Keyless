name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            apps/extension/pnpm-lock.yaml
            apps/site/pnpm-lock.yaml

      - name: Frontend type check and build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Browser extension type check and build
        working-directory: apps/extension
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Browser extension field detection tests
        working-directory: apps/extension
        env:
          CHROMIUM: google-chrome
        run: |
          pnpm test
          pnpm test:firefox

      - name: Site type check and build
        working-directory: apps/site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Frontend build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Clippy (Windows)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (Windows)
        run: cargo test --workspace

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      CARGO_HOME: /tmp/cargo-home
      CARGO_TARGET_DIR: /tmp/cargo-target
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust nodejs pnpm webkit2gtk-4.1 gtk3 libsoup3 hicolor-icon-theme polkit

      - uses: actions/checkout@v4

      # Saved on main and reused by the release workflow.
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/cargo-home/registry
            /tmp/cargo-home/git
            /tmp/cargo-target
          key: arch-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-cargo-

      - name: Build the Arch Linux package
        run: .github/scripts/build-arch-package.sh "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The Rust client for each architecture, with the runner's NDK.
      - name: Native library
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 -o apps/android/app/src/main/jniLibs build -p keyless-android --release

      # The release key, once the repository has one: the secrets
      # KEYLESS_ANDROID_KEYSTORE_BASE64 (the keystore, in base64) and
      # KEYLESS_ANDROID_KEYSTORE_PASSWORD. Without them the APK is signed with
      # the runner's debug key, which changes between runs.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.KEYLESS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice title=Android signing::No release key; the APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keyless-release.keystore"
          echo "KEYLESS_ANDROID_KEYSTORE=$RUNNER_TEMP/keyless-release.keystore" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: apps/android
        env:
          KEYLESS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYLESS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
          mkdir -p out test
          cp app/build/outputs/apk/release/app-release.apk out/keyless.apk
          cp formtest/build/outputs/apk/release/formtest-release.apk test/formtest.apk
          # The same app pointed at the fake server, for the end-to-end run.
          gradle --no-daemon :app:assembleRelease -PkeylessServer=http://10.0.2.2:8787 -PkeylessAssetLinks=http://10.0.2.2:8787/assetlinks/ 2>&1 | tee -a build.log
          cp app/build/outputs/apk/release/app-release.apk test/keyless-mock.apk
          cargo run -q -p keyless-client --example fixture > test/fixture.json
          # The test site names the form app (by its certificate) for passkeys.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          digest=$("$apksigner" verify --print-certs test/formtest.apk | awk '/SHA-256 digest/ {print $NF; exit}')
          echo "form app certificate: $digest"
          python3 - "$digest" test/fixture.json <<'PY'
          import json, sys
          digest, path = sys.argv[1], sys.argv[2]
          fingerprint = ":".join(digest[i:i + 2] for i in range(0, len(digest), 2)).upper()
          fixture = json.load(open(path))
          fixture["assetLinks"] = {"passkey.example.test": [{"relation": ["delegate_permission/common.get_login_creds"], "target": {"namespace": "android_app", "package_name": "io.github.diegocastroalves.keyless.formtest", "sha256_cert_fingerprints": [fingerprint]}}]}
          json.dump(fixture, open(path, "w"))
          PY

      # Compile errors as one annotation (job logs need a login to read).
      - name: Report build errors
        if: failure()
        working-directory: apps/android
        run: |
          test -f build.log || exit 0
          message=$(grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -80 | sed -e 's/%/%25/g' -e 's#file:///home/runner/work/Keyless/Keyless/##' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build::${message}"

      - uses: actions/upload-artifact@v4
        with:
          name: keyless-android
          path: apps/android/out/keyless.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-test
          path: apps/android/test/

  # The APK on an emulator: what works without an account (smoke.py).
  android-emulator:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: keyless-android
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: android-test
          path: apk-test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/android/scripts/emulator.sh

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # An unsigned app and disk image (no Apple developer account yet).
      - name: Build the app
        working-directory: apps/desktop
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm exec tauri build --bundles app,dmg 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: apps/desktop
        run: |
          test -f build.log || exit 0
          message=$(grep -E "^(error|warning: unused)" -A7 build.log | head -120 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=macOS build::${message}"

      - uses: actions/upload-artifact@v4
        with:
          name: keyless-macos
          path: target/release/bundle/dmg/*.dmg

  ios:
    # Xcode 16: the project format current XcodeGen writes.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Native library
        run: |
          cargo build -p keyless-ios --release --target aarch64-apple-ios-sim
          cargo build -p keyless-ios --release --target aarch64-apple-ios
          mkdir -p apps/ios/lib/iphonesimulator apps/ios/lib/iphoneos
          cp target/aarch64-apple-ios-sim/release/libkeyless_ios.a apps/ios/lib/iphonesimulator/
          cp target/aarch64-apple-ios/release/libkeyless_ios.a apps/ios/lib/iphoneos/

      # For the simulator, unsigned (installing on a phone needs an Apple developer account).
      - name: Build the app
        working-directory: apps/ios
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Keyless.xcodeproj -scheme Keyless -sdk iphonesimulator -configuration Release \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log

      - name: Run on the simulator
        working-directory: apps/ios
        timeout-minutes: 15
        run: |
          set -o pipefail
          device=$(xcrun simctl list -j devices available | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/Build/Products/Release-iphonesimulator/Keyless.app
          xcrun simctl launch --console-pty "$device" io.github.diegocastroalves.keyless --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE DONE 0" smoke.log
          message=$(tr -d '\r' < smoke.log | grep "SMOKE" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=iOS on the simulator::${message}"

      - name: Report errors
        if: failure()
        working-directory: apps/ios
        run: |
          message=$( (grep -E "error:|SMOKE" build.log smoke.log 2>/dev/null || true) | head -80 | sed -e 's/%/%25/g' -e 's#/Users/runner/work/Keyless/Keyless/##g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=iOS build::${message}"

      - name: Package the simulator app
        working-directory: apps/ios/build/Build/Products/Release-iphonesimulator
        run: zip -qr "$GITHUB_WORKSPACE/Keyless-ios-simulator.zip" Keyless.app

      - uses: actions/upload-artifact@v4
        with:
          name: keyless-ios-simulator
          path: Keyless-ios-simulator.zip
