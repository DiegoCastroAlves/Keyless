name: Release

# Push a tag like v0.1.0 to build installers for Windows and Linux and attach
# them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Keyless ${{ github.ref_name }}
          releaseBody: |
            Beta build. Keyless has not had an independent security audit yet.

            - Windows: download the `.exe` installer (Windows may warn that the publisher is unknown: the installer is not code-signed yet).
            - Linux: `.pkg.tar.zst` (Arch, CachyOS, Manjaro: `sudo pacman -U keyless-*.pkg.tar.zst`), `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE) or `.AppImage` (any distribution).
            - Browser extension: `keyless-chrome-*.zip` (Chrome, Edge, Brave, Vivaldi, Opera) and `keyless-firefox-*.zip`. See the README for how to install them.
          releaseDraft: true
          prerelease: true

  extension:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/extension/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml

      - name: Build and pack the browser extension
        working-directory: apps/extension
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          version=$(node -p "require('./package.json').version")
          (cd dist/chrome && zip -qr "../../keyless-chrome-$version.zip" .)
          (cd dist/firefox && zip -qr "../../keyless-firefox-$version.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: apps/extension/keyless-*.zip

      - name: Attach to the draft release
        if: github.ref_type == 'tag'
        working-directory: apps/extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" keyless-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  arch:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust nodejs pnpm webkit2gtk-4.1 gtk3 libsoup3 hicolor-icon-theme github-cli

      - uses: actions/checkout@v4

      - name: Build the Arch Linux package
        run: |
          version="${GITHUB_REF_NAME#v}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          mkdir /tmp/arch
          cp packaging/arch/PKGBUILD /tmp/arch/
          sed -i "s/^pkgver=.*/pkgver=$version/" /tmp/arch/PKGBUILD
          # makepkg uses this local copy of the tagged source instead of downloading it.
          git archive --format=tar.gz --prefix="Keyless-$version/" -o "/tmp/arch/keyless-$version.tar.gz" HEAD
          chown -R builder /tmp/arch
          cd /tmp/arch
          sudo -u builder makepkg --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: /tmp/arch/keyless-*.pkg.tar.zst

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" /tmp/arch/keyless-*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [build, extension, arch]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install the Tauri CLI
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # The only step that uses the signing key. Each signature is bound to the
      # version, which the app checks (no downgrades). Without the key this
      # fails and the release stays a draft.
      - name: Sign the installers and write the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern '*_x64-setup.exe' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' --pattern '*.pkg.tar.zst'
          for file in "$dir"/*; do
            apps/desktop/node_modules/.bin/tauri signer sign --app-version "$version" "$file" > /dev/null
          done
          python3 .github/scripts/update-manifest.py "$version" "$GITHUB_REPOSITORY" "$dir"
          gh release upload "$GITHUB_REF_NAME" "$dir/latest.json" --clobber --repo "$GITHUB_REPOSITORY"

      # Published only once every file and the manifest are attached: the app
      # reads the public release list.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
