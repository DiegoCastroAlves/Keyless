[package]
name = "keyless-wasm"
description = "The Keyless client for the web vault, as WebAssembly"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keyless-client = { path = "../keyless-client" }
wasm-bindgen = "0.2"

# Randomness from the browser (crypto.getRandomValues), for both versions
# the crates use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { version = "1.27.0", features = ["js"] }
