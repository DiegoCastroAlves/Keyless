[package]
name = "keyless-core"
description = "Cryptography, data model and import logic shared by every Keyless client"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
# Reading other password managers' encrypted exports (import/decrypt.rs).
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc", "block-padding", "zeroize"] }
chacha20 = "0.10.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
quick-xml = "0.42.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
csv = "1.4.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
# Passkeys (ES256), see passkey.rs.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
# Sites, the registrable domains (site.rs).
psl = "2.1.239"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
# Websites (site.rs).
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.0", features = ["derive", "serde"] }
# Password strength (health.rs).
zxcvbn = "3.1.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Locking key pages in RAM (crypto.rs); WebAssembly has no such thing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
region = "4"
