[package]
name = "keyless-client"
description = "A Keyless client without input or output of its own, shared by the Android app and the web vault"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
keyless-core = { path = "../keyless-core" }
psl = "2.1.239"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4"] }
zeroize = "1.9.0"

[dev-dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
sha2 = "0.11.0"
