[workspace]
resolver = "3"
members = ["crates/keyless-core", "crates/keyless-client", "crates/keyless-wasm", "crates/keyless-android", "crates/keyless-ios", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.12"
edition = "2024"
repository = "https://github.com/DiegoCastroAlves/Keyless"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The web vault: small, and fast at key derivation.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"

[profile.dev.package.argon2]
opt-level = 3

# Attachments are decrypted and their previews decoded in the dev build too;
# unoptimized, a few hundred KB take seconds.
[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
