# The iOS app's Xcode project (generated by XcodeGen: `xcodegen generate`).
name: Keyless
options:
  bundleIdPrefix: io.github.diegocastroalves
  deploymentTarget:
    iOS: "16.0"
targets:
  Keyless:
    type: application
    platform: iOS
    sources:
      - path: Keyless
    info:
      path: Keyless/Info.plist
      properties:
        CFBundleDisplayName: Keyless
        CFBundleShortVersionString: "0.1.12"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Unlock Keyless with Face ID.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.diegocastroalves.keyless.setup
            CFBundleURLSchemes: [keyless]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.diegocastroalves.keyless
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Keyless/Bridge.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: ["-lkeyless_ios", "-framework", "Security"]
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
